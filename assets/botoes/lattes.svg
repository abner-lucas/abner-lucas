<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 115.3 46" width="115.3" height="46" role="img" aria-label="Lattes"><title>Lattes</title><style>@font-face{font-family:'forte';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}.f-forte{font-family:'forte','Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif;font-weight:700}.sobe{animation:sobe 1.1s cubic-bezier(.16,1,.3,1) backwards}@keyframes sobe{from{transform:translateY(var(--d,80px))}}.surge{animation:surge 1s cubic-bezier(.16,1,.3,1) backwards}@keyframes surge{from{opacity:0;transform:translateY(24px)}}.flutua{animation:flutua 5s ease-in-out infinite}@keyframes flutua{50%{transform:translateY(-9px)}}.gira{transform-box:fill-box;transform-origin:center;animation:gira 40s linear infinite}@keyframes gira{to{transform:rotate(360deg)}}.gira-rapido{transform-box:fill-box;transform-origin:center;animation:gira 8s linear infinite}.pulsa{animation:pulsa 2s ease-in-out infinite}@keyframes pulsa{50%{opacity:.45}}.cursor{animation:cursor 1s steps(1) infinite}@keyframes cursor{50%{opacity:0}}.robo-led{animation:robo-led 1.4s ease-in-out infinite}@keyframes robo-led{50%{opacity:.35}}.robo-olhos{transform-box:fill-box;transform-origin:center;animation:robo-piscar 4.5s infinite}@keyframes robo-piscar{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}.robo-braco{transform-box:view-box;transform-origin:63px 70px;animation:robo-acenar 2.2s ease-in-out infinite}@keyframes robo-acenar{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-22deg)}80%{transform:rotate(8deg)}90%{transform:rotate(-16deg)}}.risca{animation:risca .9s ease-in-out backwards}@keyframes risca{from{stroke-dashoffset:1}}.digita{transform-box:fill-box;transform-origin:0 50%}@keyframes digita{from{transform:scaleX(0)}}.aperta{transform-box:fill-box;transform-origin:center;animation:aperta .9s cubic-bezier(.16,1,.3,1) backwards}@keyframes aperta{from{opacity:0;transform:rotate(-150deg) scale(.4)}}.estoura{transform-box:fill-