# Gera a animação da cobrinha comendo o gráfico de contribuições
# e publica os SVGs na branch "output", usada pelo README.
name: Cobrinha de contribuições

on:
  schedule:
    - cron: "0 */12 * * *" # a cada 12 horas
  workflow_dispatch: # permite rodar manualmente na aba Actions
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gerar SVGs (tema claro e escuro)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#ff6b4a&color_dots=#e9eee6,#c8f05a,#7fd39f,#22b07d,#0e7a54
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff6b4a&color_dots=#15221d,#1f4a37,#13976a,#3dd69b,#c8f05a

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
